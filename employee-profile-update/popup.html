<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: Arial, sans-serif;
      font-size: 13px;
      width: 240px;
      padding: 14px 16px;
      color: #333;
      margin: 0;
    }
    h3 {
      margin: 0 0 8px;
      font-size: 14px;
      color: #1D9E75;
    }
    p { margin: 0 0 6px; line-height: 1.5; color: #555; }
    .badge {
      display: inline-block;
      background: #E1F5EE;
      color: #085041;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      margin-bottom: 8px;
    }
    .note {
      font-size: 11px;
      color: #999;
      margin-top: 10px;
      border-top: 1px solid #eee;
      padding-top: 8px;
    }
  </style>
</head>
<body>
  <h3>&#9998; EPU Assistant</h3>
  <span class="badge">v1.0</span>
  <p>Employee Profile Update request assistant for FCI HRMS.</p>
  <p>Navigate to <strong>Core HR → Request → Employee Profile Update</strong> and click the ✓ icon on any pending request.</p>
  <p class="note">The assistant activates automatically on RHR requests. The floating panel will appear on the approve page.</p>
</body>
</html>

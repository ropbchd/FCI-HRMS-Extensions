<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: Arial, sans-serif;
      width: 260px;
      padding: 16px;
      background: #f4f6f8;
    }
    h2 {
      font-size: 14px;
      color: #026636;
      margin: 0 0 8px 0;
    }
    p {
      font-size: 12px;
      color: #444;
      margin: 0 0 12px 0;
      line-height: 1.5;
    }
    .status {
      font-size: 11px;
      color: #888;
      border-top: 1px solid #ddd;
      padding-top: 8px;
      margin-top: 4px;
    }
    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #026636;
      margin-right: 5px;
    }
  </style>
</head>
<body>
  <h2>🌾 FCI NOC Assistant</h2>
  <p>Active on FCI HRMS NOC review pages.</p>
  <p><strong>Step 1 Active:</strong> Automatically clicks <em>"View Action History"</em> when a NOC review page opens.</p>
  <div class="status">
    <span class="dot"></span> Extension is running
  </div>
</body>
</html>
